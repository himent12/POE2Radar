name: release

# Cut a release by pushing a version tag, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
# This builds self-contained Windows x64 + Linux x64 binaries and attaches them to a GitHub Release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}   # allow manual runs from the Actions tab

permissions:
  contents: write          # needed to create the Release

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Publish win-x64
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          dotnet publish src/POE2Radar.Overlay/POE2Radar.Overlay.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:Version=$ver `
            -p:DebugType=none -p:DebugSymbols=false `
            -p:Deterministic=true -p:ContinuousIntegrationBuild=true `
            -o publish
          Remove-Item publish/*.pdb -Force -ErrorAction SilentlyContinue
          Copy-Item README.md, LICENSE publish/
          Compress-Archive -Path publish/* -DestinationPath "POE2Radar-${{ github.ref_name }}-win-x64.zip" -Force
      - uses: softprops/action-gh-release@v2
        with:
          files: POE2Radar-*-win-x64.zip
          generate_release_notes: true

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Publish linux-x64
        run: |
          ver="${GITHUB_REF_NAME#v}"
          dotnet publish src/POE2Radar.Overlay/POE2Radar.Overlay.csproj \
            -c Release -r linux-x64 --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -p:Version=$ver \
            -p:DebugType=none -p:DebugSymbols=false \
            -p:Deterministic=true -p:ContinuousIntegrationBuild=true \
            -o publish
          rm -f publish/*.pdb
          cp README.md LICENSE publish/
          tar -C publish -czf "POE2Radar-${GITHUB_REF_NAME}-linux-x64.tar.gz" .
      - uses: softprops/action-gh-release@v2
        with:
          files: POE2Radar-*-linux-x64.tar.gz
          generate_release_notes: true
